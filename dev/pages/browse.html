<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Genomes | PARD</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <div class="logo">PARD</div>

    <nav>

        <a href="../index.html">Home</a>
        <a href="browse.html">Browse</a>

    </nav>

</header>

<main>

    <h1>Browse Genomes</h1>

    <p id="genomeCount"></p>

    <div class="browse-controls">

        <label for="searchInput">Search:</label>

        <input
            type="text"
            id="searchInput"
            placeholder="Genome, host, accession...">

        <label for="hitFilter">Resistance status:</label>

        <select id="hitFilter">

            <option value="all">
                All genomes
            </option>

            <option value="anyHits">
                Any resistance-associated hits
            </option>

            <option value="proteinHits">
                Protein hits
            </option>

            <option value="nucleotideHits">
                Nucleotide hits
            </option>

            <option value="highConfidence">
                High-confidence candidates
            </option>

            <option value="noHits">
                No detected hits
            </option>

        </select>

        <label for="sortSelect">Sort by:</label>

        <select id="sortSelect">

            <option value="nameAsc">Name (A–Z)</option>
            <option value="nameDesc">Name (Z–A)</option>
            <option value="lengthDesc">Longest Genome</option>
            <option value="lengthAsc">Shortest Genome</option>
            <option value="proteinDesc">Most Protein Hits</option>
            <option value="nucleotideDesc">Most Nucleotide Hits</option>

        </select>

    </div>

    <div id="genomeContainer"></div>
    
    <div id="paginationControls"></div>

</main>

<script src="../js/database.js"></script>
<script src="../js/browse.js"></script>

</body>

</html>
