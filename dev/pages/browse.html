<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Genomes | PARD</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <a href="../index.html" class="logo">
        PARD
    </a>

    <nav aria-label="Main navigation">

        <a href="../index.html">
            Home
        </a>

        <a href="search.html">
            Search
        </a>

        <a
            href="browse.html"
            class="active"
            aria-current="page">
            Browse
        </a>

        <a href="statistics.html">
            Statistics
        </a>

        <a href="methods.html">
            Methods
        </a>

        <a href="about.html">
            About
        </a>

    </nav>

</header>

<main>

    <section class="browse-intro">

        <h1>Browse Phage Genomes</h1>

        <p class="browse-description">
            Search and compare bacteriophage genomes by name, host,
            accession number, and resistance-associated analysis results.
        </p>

    </section>

    <section class="browse-toolbar">

        <div class="browse-controls">

            <div class="control-group search-control">

                <label for="searchInput">
                    Search genomes
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Genome, host, accession..."
                    autocomplete="off">

            </div>

            <div class="control-group">

                <label for="hitFilter">
                    Resistance status
                </label>

                <select id="hitFilter">

                    <option value="all">
                        All genomes
                    </option>

                    <option value="anyHits">
                        Any resistance-associated hits
                    </option>

                    <option value="proteinHits">
                        Protein hits
                    </option>

                    <option value="nucleotideHits">
                        Nucleotide hits
                    </option>

                    <option value="highConfidence">
                        High-confidence candidates
                    </option>

                    <option value="noHits">
                        No detected hits
                    </option>

                </select>

            </div>

            <div class="control-group">

                <label for="sortSelect">
                    Sort by
                </label>

                <select id="sortSelect">

                    <option value="nameAsc">
                        Name (A–Z)
                    </option>

                    <option value="nameDesc">
                        Name (Z–A)
                    </option>

                    <option value="lengthDesc">
                        Longest Genome
                    </option>

                    <option value="lengthAsc">
                        Shortest Genome
                    </option>

                    <option value="proteinDesc">
                        Most Protein Hits
                    </option>

                    <option value="nucleotideDesc">
                        Most Nucleotide Hits
                    </option>

                </select>

            </div>

            <button
                type="button"
                id="resetBrowseButton"
                class="reset-browse-button">
                Reset All
            </button>

        </div>   

    </section>

    <div class="results-header">

        <p
            id="genomeCount"
            aria-live="polite">
        </p>

        <p class="results-hint">
            Select a card to view the full genome analysis.
        </p>

    </div>

    <div id="genomeContainer"></div>

    <div id="paginationControls"></div>

</main>

<script src="../js/database.js"></script>
<script src="../js/browse.js"></script>

</body>

</html>
